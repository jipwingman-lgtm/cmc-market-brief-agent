[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmc-market-brief-agent"
version = "0.1.0"
description = "Crypto market brief and anomaly monitor powered by the CoinMarketCap API."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cmc-brief = "cmc_market_brief.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
